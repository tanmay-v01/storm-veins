name: Storm Veins 24/7 Cloud Cadence & Inbound Watcher

on:
  schedule:
    # 06:00 UTC = 11:30 AM IST (Daily automated outreach follow-up cadence window)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Action to trigger'
        required: true
        default: 'FULL_CADENCE'
        type: choice
        options:
          - FULL_CADENCE
          - INBOX_SYNC_ONLY
          - STATUS_AUDIT
  repository_dispatch:
    types: [antigravity-command, run-cadence, sync-inbox]

permissions:
  contents: write

jobs:
  run-cloud-cadence:
    name: Execute Autonomous Cloud Pass
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai requests || true

      - name: Run Cloud Autonomous Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HOSTINGER_SMTP_PASS: ${{ secrets.HOSTINGER_SMTP_PASS }}
          ACTION_TYPE: ${{ inputs.action_type || 'FULL_CADENCE' }}
        run: |
          echo "=== 🪐 ANTIGRAVITY CLOUD AUTONOMOUS PASS RUNNING ==="
          python -c "
          import sys
          from datetime import datetime
          print(f'[Cloud Runner] Timestamp (UTC): {datetime.utcnow().isoformat()}')
          print(f'[Cloud Runner] Node: GitHub Actions Cloud Container')
          print(f'[Cloud Runner] Executing sovereign pipeline check...')
          "
          # Run database verification & sync
          python -c "
          from outreach import db
          db.init_db()
          stats = db.get_stats()
          print(f'[Cloud DB] Total leads tracked: {stats.get(\"total\", 0)}')
          print(f'[Cloud DB] Sent count: {stats.get(\"sent\", 0)}')
          print(f'[Cloud DB] Delivery integrity: {stats.get(\"deliveryRate\", 0)}%')
          db.sync_to_csv_and_ts()
          "

      - name: Commit & Push Updated CRM Ledger (if modified)
        run: |
          git config --global user.name "Antigravity Cloud Worker"
          git config --global user.email "bot@antigravity.internal"
          git add outreach/master_outreach_tracker.csv src/data/crmLeads.ts || true
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "chore(cloud-cadence): sync CRM state and ledger [skip ci]"
            git push origin main
          fi
