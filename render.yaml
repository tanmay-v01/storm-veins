services:
  - type: web
    name: stormveins-sovereign-crm
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /api/stats
    envVars:
      - key: PORT
        value: 5050
      - key: BIND_HOST
        value: 0.0.0.0
      - key: ANTICHAT_PASSWORD
        value: anti-ops
      - key: VITE_STUDIO_PASSWORD
        value: storm-ops
      - key: GEMINI_API_KEY
        sync: false
